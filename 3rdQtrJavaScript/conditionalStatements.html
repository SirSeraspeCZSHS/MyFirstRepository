<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statement</title>
</head>
<body>
    <h1>Conditional Statement</h1>
    <script>
        let x = 10;
        if (x == 10) {
            console.log("x is equal to 10");
        }
        console.log("This is a And or Or example:");
        console.log("______");
        let strand = "ICT"
        let Section = "Competence"
        if (strand == "ICT" && Section == "Competence") {
                console.log("You are in the ICT Competence Section");
        }
        let track = "TVL"
        let grade = "12"
        if (track == "TVL" || grade == "12") {
                console.log("You are in the 11 TVL Track");
        }
        console.log("This is a If else example:");
        console.log("______");
        let healthStatus = -5;
        if(healthStatus > 0){
            console.log("You are alive");
        }else{
            console.log("You are dead");
        }
        console.log("This is else if example:");
        let qtrGrade = 99;
        if(qtrGrade >= 98){
            console.log("You are a With Highest Honor student");
        }else if(qtrGrade >= 95){
            console.log("You are a With High Honor student");
        }else if(qtrGrade >= 90){
            console.log("You are a With Honor student");
        }else if(qtrGrade >= 75){
            console.log("You passed the subject");
        }else{
            console.log("You failed the subject");
        }
        console.log("______");
        
        console.log("end of program");
    </script>
</body>
</html>
