<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable in JavaScript</title>
</head>
<body>
    <h1>Variable in JavaScript</h1>
    <button type="button" onclick="private_variables()">
        This will show the private_variables</button>
    <script>
        let x = 50;
        let y = 4;
        y = 10;
        x = 20;
        console.log(x + y);
        const z = 100;
        console.log(z);
        let let_This = 5;
        console.log(let_This);
        var studentName = "John Doe";
        console.log(studentName);
        function private_variables() {
            let _x = "This is a private variable";
            console.log(_x);
        }
        var $ = "This is valid";
        let $$ = "Also valid";
        const $$$valid = "Still valid";
        console.log($);
        console.log($$);
        console.log($$$valid);
        let declareVar;// Declaration without initialization
        declareVar = "Now it's initialized";// Initialization
        console.log(declareVar);
        const price1 = 5;
        const price2 = 6;
        let total = price1 + price2;
        console.log("Total Price: " + total);
        autoVar = "This is an auto global variable";
        autoVar = "Changed value of auto global variable";
        console.log(autoVar);
        let num1 = 10;
        let num2 = 20;
        let num3 = 30;
        console.log(num1 + num2+ num3); // Outputs "102030"
        let text1 = "Hello"
        let text2 = "World"
        let text3 = "!"
        console.log(text1 + " " + text2 + text3); // Outputs "Hello World!"
        let a = "a", b = "b", c = "c";
        console.log(a + b + c); // Outputs "undefinedundefinedundefined"   
    
        
        let globalVar = "I am a global variable";// Global variable
        {
            let localVar1 = "I am a local variable";// Local variable
            console.log(globalVar);
            console.log(localVar1);
        }
        {
            let localVar1 = "I am a another local variable";// Local variable
            console.log(globalVar);
            console.log(localVar1);
        }

        let reAssignLet = "First Value";
        console.log(reAssignLet);
        let reAssignLet2 = "Second Value"; // This will cause an error
        console.log(reAssignLet2);

        var reDeclareVar = "First Declaration";
        console.log(reDeclareVar);
        reDeclareVar = "Second Declaration";
        console.log(reDeclareVar);

        hoistedVar = "I am hoisted!";//initialize before declaration
        console.log(hoistedVar);
        //let hoistedVar;

        let numBig = 12345678901234567890;
        console.log(numBig);

        console.log(bigIntNum2);


    </script>
</body>
</html>
